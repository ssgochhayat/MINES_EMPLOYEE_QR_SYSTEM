<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="access-page">
        <section class="access-card">
            <div class="access-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1>Access Denied</h1>
            <p>Your account does not have permission to open this page. Please contact an administrator to update your access.</p>
            <div class="access-actions">
                {% if request.user.is_authenticated %}
                    <a href="/logout/" class="btn btn-danger">Logout</a>
                {% else %}
                    <a href="/login/" class="btn btn-primary">Login</a>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>

<style>
body{
    background:#f1f5f9;
    min-height:100vh;
}

.access-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.access-card{
    width:min(440px, 100%);
    background:white;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(15,23,42,0.12);
    padding:34px;
    text-align:center;
}

.access-icon{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fee2e2;
    color:#dc2626;
    font-size:30px;
}

.access-card h1{
    color:#0f172a;
    font-size:28px;
    font-weight:700;
}

.access-card p{
    color:#64748b;
    margin:12px 0 22px;
}
</style>

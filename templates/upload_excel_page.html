{% extends 'base.html' %}

{% block content %}


<div class="container mt-4">

    <div class="card p-4">

        <h3>Upload Employee Excel</h3>

        <form id="uploadForm"
              enctype="multipart/form-data">

            {% csrf_token %}

            <input type="file"
                   name="file"
                   accept=".xlsx,.xls"
                   class="form-control mb-3"
                   required>

            <button type="submit"
                    class="btn btn-success">

                Upload Excel

            </button>

        </form>

        <div id="result" class="mt-3"></div>

    </div>

</div>

<script>

document.getElementById('uploadForm').addEventListener('submit', function(e){

    e.preventDefault();

    let formData = new FormData(this);

    fetch("{% url 'upload_employee_excel' %}", {

        method: "POST",
        body: formData,

        headers: {
            "X-CSRFToken":
            document.querySelector('[name=csrfmiddlewaretoken]').value
        }

    })
    .then(res => res.json())
    .then(data => {

        let alertClass = data.error ? "alert-danger" : "alert-success";
        let details = "";

        if (data.errors && data.errors.length) {

            details = "<hr><strong>Skipped rows:</strong><ul class='mb-0'>";

            data.errors.forEach(function(error) {
                details += "<li>" + error + "</li>";
            });

            details += "</ul>";
        }

        document.getElementById("result").innerHTML =

            "<div class='alert " + alertClass + "'>" +
            (data.message || data.error || "Upload completed") +
            "<br>Created : " + (data.created || 0) +
            "<br>Skipped : " + (data.skipped || 0) +
            (data.details ? "<br>" + data.details : "") +
            details +
            "</div>";

    })
    .catch(error => {

        document.getElementById("result").innerHTML =

            "<div class='alert alert-danger'>" +
            "Upload Failed" +
            "</div>";

    });

});

</script>

{% endblock %}

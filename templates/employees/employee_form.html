{% extends 'base.html' %}

{% block content %}

<h2>Add Employee</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <label>Upload  Documents:</label>

    <input
        type="file"
        name="documents"
        multiple
    >

    <br><br>

    <button type="submit">
        Save Employee
    </button>

</form>

{% endblock %}

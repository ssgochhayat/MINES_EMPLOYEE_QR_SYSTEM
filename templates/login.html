<!DOCTYPE html>
<html>
<head>

    <title>Login - Mine QR System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Poppins,sans-serif;
        }

        .login-box{
            width:400px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h2{
            font-weight:700;
            color:#0f172a;
        }

        .btn-login{
            width:100%;
            background:#0f172a;
            color:white;
            padding:12px;
            border:none;
            border-radius:12px;
            font-weight:600;
        }

        .form-control{
            height:50px;
            border-radius:12px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="title">

        <h2>Mine QR System</h2>

        <p>Admin Login</p>

    </div>

    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Username"
                required
            >

        </div>

        <div class="mb-3">

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password"
                required
            >

        </div>

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
